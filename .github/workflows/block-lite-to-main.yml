name: Block lite to main

on:
  pull_request:
    branches:
      - main

jobs:
  block-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Check source branch
        env:
          SOURCE: ${{ github.head_ref }}
        run: |
          if [[ "$SOURCE" == "lite" ]]; then
            echo "Merging lite into main is forbidden"
            exit 1
          fi

