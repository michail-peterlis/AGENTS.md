name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version tag, for example v0.2.0
        required: true
        type: string
      source:
        description: Edition to package (release main first; lite adds its package to that release)
        required: true
        type: choice
        options:
          - main
          - lite
        default: main

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
      SOURCE: ${{ inputs.source }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check inputs and release state
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Run this workflow from main."; exit 1
          fi
          if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must look like v1.2.3."; exit 1
          fi
          if gh release view "$VERSION" > /dev/null 2>&1; then exists=yes; else exists=no; fi
          if [ "$SOURCE" = main ] && [ "$exists" = yes ]; then
            echo "::error::Release $VERSION already exists."; exit 1
          fi
          if [ "$SOURCE" = lite ] && [ "$exists" = no ]; then
            echo "::error::Release $VERSION does not exist; release main first."; exit 1
          fi

      - name: Check out the dispatched main commit
        uses: actions/checkout@v4
        with:
          path: repo
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Check out the lite edition
        if: inputs.source == 'lite'
        uses: actions/checkout@v4
        with:
          path: lite
          ref: lite
          fetch-depth: 1

      - name: Check that the tag is unused
        if: inputs.source == 'main'
        run: |
          if git -C repo rev-parse -q --verify "refs/tags/$VERSION" > /dev/null; then
            echo "::error::Tag $VERSION already exists."; exit 1
          fi

      - name: Warn if lite is behind main
        if: inputs.source == 'lite'
        run: |
          base=$(git -C lite log -1 --format=%B \
            | sed -n 's/^Derived-from:[[:space:]]*\([0-9a-f]\{7,40\}\)[[:space:]]*$/\1/p' | head -n 1)
          if [ -z "$base" ]; then
            echo "::warning::The lite commit has no 'Derived-from: <main commit>' line."
          elif ! git -C repo cat-file -e "$base^{commit}" 2> /dev/null; then
            echo "::warning::Derived-from commit $base is not in main's history."
          elif ! git -C repo diff --quiet "$base" "$GITHUB_SHA" -- AGENTS.md .agents; then
            echo "::warning::main changed AGENTS.md or .agents/ since lite was derived from $base."
          fi

      - name: Build package
        run: |
          set -euo pipefail
          if [ "$SOURCE" = main ]; then
            src=repo; commit="$GITHUB_SHA"; package="agents-kit-$VERSION"
          else
            src=lite; commit=$(git -C lite rev-parse HEAD); package="agents-kit-lite-$VERSION"
          fi
          mkdir -p "build/$package/.agents" dist
          git -C "$src" archive "$commit" AGENTS.md .agents | tar -x -C "build/$package"
          cp -T --remove-destination repo/LICENSE "build/$package/.agents/LICENSE"
          (cd "build/$package" \
            && find AGENTS.md .agents -path .agents/workspace -prune -o -type f -print0 \
            | sort -z | xargs -0 -r zip -X -q -nw "../../dist/$package.zip")
          (cd dist && sha256sum "$package.zip" > "$package.zip.sha256")
          awk -v heading="## [$VERSION]" 'index($0, heading) == 1 {found=1; next} /^## \[/ {found=0} found' \
            repo/CHANGELOG.md > dist/notes.md
          if ! grep -q '[^[:space:]]' dist/notes.md; then
            echo "::error::CHANGELOG.md has no '## [$VERSION]' section."; exit 1
          fi
          echo "Packaged $src commit $commit:"; unzip -l "dist/$package.zip"

      - name: Publish
        run: |
          if [ "$SOURCE" = main ]; then
            gh release create "$VERSION" dist/*.zip dist/*.sha256 \
              --target "$GITHUB_SHA" --title "$VERSION" --notes-file dist/notes.md
          else
            gh release upload "$VERSION" dist/*.zip dist/*.sha256
          fi
