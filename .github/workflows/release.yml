name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (optional, e.g. v0.3.2). Leave empty to use v<VERSION> from VERSION file."
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      INPUT_VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check release ref
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Run this workflow from main."; exit 1
          fi

      - name: Check out the dispatched main commit
        uses: actions/checkout@v4
        with:
          path: repo
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Check out the lite edition
        uses: actions/checkout@v4
        with:
          path: lite
          ref: lite
          fetch-depth: 1

      - name: Determine and validate release version
        run: |
          input_ver=$(echo "$INPUT_VERSION" | tr -d '[:space:]')
          if [ -n "$input_ver" ]; then
            if ! echo "$input_ver" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
              echo "::error::Provided version '$input_ver' must look like v1.2.3 without leading zeros." >&2
              exit 1
            fi
            ver="$input_ver"
            echo "==> Using manual version override: $ver"
          else
            if [ ! -f repo/VERSION ]; then
              echo "::error::VERSION file not found in repo." >&2
              exit 1
            fi
            raw=$(tr -d '[:space:]' < repo/VERSION)
            raw=${raw#v}
            if ! echo "$raw" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
              echo "::error::repo/VERSION content '$raw' is not canonical SemVer (e.g. 1.2.3)." >&2
              exit 1
            fi
            ver="v$raw"
            echo "==> Determined version from repo/VERSION: $ver"
          fi

          if gh release view "$ver" > /dev/null 2>&1; then
            echo "::error::Release $ver already exists." >&2
            exit 1
          fi
          if git -C repo rev-parse -q --verify "refs/tags/$ver" > /dev/null; then
            echo "::error::Tag $ver already exists." >&2
            exit 1
          fi

          echo "VERSION=$ver" >> "$GITHUB_ENV"

      - name: Build dual release packages
        run: |
          set -euo pipefail
          mkdir -p dist

          build_edition() {
            local src="$1"
            local commit="$2"
            local package="$3"

            echo "==> Packaging $package from $src ($commit)..."
            mkdir -p "build/$package/.agents"
            git -C "$src" archive "$commit" AGENTS.md .agents | tar -x -C "build/$package"
            cp -T --remove-destination repo/LICENSE "build/$package/.agents/LICENSE"
            (cd "build/$package" \
              && find AGENTS.md .agents -path .agents/workspace -prune -o -type f -print0 \
              | sort -z | xargs -0 -r zip -X -q -nw "../../dist/$package.zip")
            (cd dist && sha256sum "$package.zip" > "$package.zip.sha256")
            echo "Packaged $package.zip:"
            unzip -l "dist/$package.zip"
          }

          # 1. Package full edition from main
          build_edition repo "$GITHUB_SHA" "agents-kit-$VERSION"

          # 2. Package distilled edition from lite
          lite_commit=$(git -C lite rev-parse HEAD)
          build_edition lite "$lite_commit" "agents-kit-lite-$VERSION"

          # 3. Extract release notes from CHANGELOG.md (with commit fallback)
          if [ -f repo/CHANGELOG.md ]; then
            awk -v heading="## [$VERSION]" 'index($0, heading) == 1 {found=1; next} /^## \[/ {found=0} found' \
              repo/CHANGELOG.md > dist/notes.md
          else
            : > dist/notes.md
          fi

          if ! grep -q '[^[:space:]]' dist/notes.md; then
            echo "::error::CHANGELOG.md has no '## [$VERSION]' section."; exit 1
          fi

          echo "" >> dist/notes.md
          echo "---" >> dist/notes.md
          echo "### Packaged Commit Identities" >> dist/notes.md
          echo "- Full kit (\`main\`): \`$GITHUB_SHA\`" >> dist/notes.md
          echo "- Distilled kit (\`lite\`): \`$lite_commit\`" >> dist/notes.md

      - name: Publish Release with both editions
        run: |
          gh release create "$VERSION" dist/*.zip dist/*.sha256 \
            --target "$GITHUB_SHA" --title "$VERSION" --notes-file dist/notes.md
