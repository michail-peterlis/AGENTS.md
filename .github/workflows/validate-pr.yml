name: Validate PR

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate PR Changes
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate shell scripts
        run: |
          found=0
          for script in $(find .agents/skills -name "*.sh" 2>/dev/null); do
            echo "Checking syntax: $script"
            sh -n "$script"
            found=1
          done
          if [ "$found" -eq 1 ]; then
            echo "All scripts passed syntax validation."
          fi

      - name: Enforce CHANGELOG update
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Fetch base SHA if not present in shallow clone
          if ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            git fetch origin "$BASE_SHA" --depth=1
          fi

          if ! git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -q '^CHANGELOG.md$'; then
            echo "::error::CHANGELOG.md was not updated in this pull request. Every PR to main strictly requires changelog notes."
            exit 1
          fi

          if ! git diff "$BASE_SHA" "$HEAD_SHA" -- CHANGELOG.md | awk '/^\+[^+]/ { sub(/^\+/, ""); if ($0 ~ /[^ \t\r\n]/) { f=1; exit 0 } } END { exit !f }'; then
            echo "::error::CHANGELOG.md was touched but contains no substantive text additions."
            exit 1
          fi
          echo "CHANGELOG.md update verified."
